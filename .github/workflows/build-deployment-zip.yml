name: Build deployment ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faceisle-deployment
  cancel-in-progress: true

jobs:
  build:
    name: Test, compile, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out Faceisle
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile production site
        run: npm run build

      - name: Package ready-to-upload site
        uses: actions/upload-artifact@v4
        with:
          name: faceisle-deployment
          path: dist/
          if-no-files-found: error
          retention-days: 90
